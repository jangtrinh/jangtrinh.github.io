name: check-hub

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-hub:
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright-core
      - run: node scripts/check-hub.mjs
      - run: node scripts/check-hub.mjs --expect-fail tests/fixtures/drift/*.html tests/fixtures/rules/*.html tests/fixtures/rules/*.css tests/fixtures/rules/*.txt
      - run: node scripts/check-hub.mjs tests/fixtures/pass/videos-target.html
      - run: node scripts/check-ecosystem.mjs
      - run: node scripts/check-ecosystem.mjs --self-test
      - run: node scripts/check-ecosystem.mjs --online
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-hub-screenshots
          path: tests/_out/
          if-no-files-found: ignore
